<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../sass/scss/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header class="nav-bar">
        <div class="nav-logo"><img src="../assets/Home page/icon/nav-logo.svg" alt=""></div>
        <nav class="nav-menu">
            <ul>
                <li id="marketplace">Marketplace</li>
                <li id="rankings">Rankings</li>
                <li id="connect-wallet">Connect a wallet</li>
            </ul>
            <a href=""><button class="main-btn"><img src="../assets/Home page/icon/User.svg" alt=""> Sign in
                </button></a>
        </nav>
        <div class="hambuger-menu"><img src="../assets/Home page/icon/Burger Menu.svg" alt=""></div>
    </header>
    <main>
        <section class="create-account">
            <div class="container1">
                <div class="create-account-box">
                    <img class="mobile-pic" src="../assets/signuppage/img/ImagePlaceholder.png" alt="">
                    <div class="account-box-left">
                        <img src="../assets/signuppage/img/ImagePlaceholder.png" alt="">
                    </div>
                    <div class="account-box-right">
                        <div class="hero-heading">
                            <h4> Create Account <h4>
                                    <p>Welcome! Enter Your Details And Start Creating,
                                        Collecting And Selling Nfts.</p>
                        </div>
                        <div class="input-box">
                            <div class="username input">
                                <img width="20" src="../assets/signuppage/icon/User.svg" alt="">
                                <input type="text" class="sign-input" id="username" placeholder="Username">
                            </div>
                            <div class="email input">
                                <img src="../assets/signuppage/icon/EnvelopeSimple.svg" alt="">
                                <input type="text" class="sign-input" id="email" placeholder="Email Adress">
                            </div>
                            <div class="username input">
                                <img src="../assets/signuppage/icon/LockKey.svg" alt="">
                                <input type="text" class="sign-input" id="username" placeholder="Password">

                            </div>
                            <div class="password-confirmation input">
                                <img src="../assets/signuppage/icon/LockKey.svg" alt="">
                                <input type="text" class="sign-input" id="username" placeholder="Confirm Password">
                            </div>
                        </div>
                        <button class="btn-long-purple">
                            Create Account
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
